[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epoch-engine"
version = "0.1.0"
description = "Deterministic statistical and integrity engine for EPOCH"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17,<25",
    "scipy>=1.13,<2",
    "pydantic>=2.7,<3"
]

[project.optional-dependencies]
modeling = [
    "scikit-learn>=1.5,<2"
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
